<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>document.documentElement.dataset.theme=localStorage.getItem('awesome-rss-theme')||'light'</script>
  <title>awesome-chilean-rss-app</title>
  <meta name="description"
    content="Explora y descarga feeds RSS de medios chilenos. Directorio actualizado de fuentes RSS de noticias, tecnologia, deportes y mas.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
  <link rel="apple-touch-icon" href="favicon_io/apple-touch-icon.png">
  <link rel="manifest" href="favicon_io/site.webmanifest">
  <meta name="theme-color" content="#111111">
  <script type="importmap">
    {
      "imports": {
        "cuelume": "https://esm.sh/cuelume@0.1.2"
      }
    }
  </script>
</head>

<body>
  <div class="app">
    <header class="app-header">
      <div>
        <div class="app-title-row">
          <h1 class="app-title" data-i18n="title">awesome-chilean-rss-app</h1>
          <a href="https://github.com/alplox/awesome-chilean-rss-app" target="_blank" rel="noopener" class="github-link" aria-label="Ver repositorio en GitHub" title="Ver repositorio en GitHub">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
          </a>
        </div>
        <p class="app-subtitle" data-i18n="subtitle">Explora y descarga feeds RSS de medios chilenos</p>
      </div>
      <div class="header-controls">
        <select id="lang-select" class="lang-select" data-i18n-aria="lang-label">
          <option value="es" data-i18n="lang-es">Espanol</option>
          <option value="en" data-i18n="lang-en">English</option>
          <option value="pt" data-i18n="lang-pt">Portugues</option>
        </select>
        <button class="sound-toggle" id="sound-toggle" title="Desactivar sonidos" aria-label="Alternar sonidos">
          <svg class="sound-on" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
          <svg class="sound-off" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        </button>
        <div class="theme-switcher" role="radiogroup">
          <button class="theme-btn active" data-theme="light" aria-label="Claro" title="Claro" data-cuelume-press="sparkle">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.4" />
              <path
                d="M8 1V3M8 13V15M1 8H3M13 8H15M3.05 3.05L4.46 4.46M11.54 11.54L12.95 12.95M3.05 12.95L4.46 11.54M11.54 4.46L12.95 3.05"
                stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </button>
          <button class="theme-btn" data-theme="dark" aria-label="Oscuro" title="Oscuro" data-cuelume-press="sparkle">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M13 8.5A5.5 5.5 0 1 1 7.5 3a4.5 4.5 0 0 0 5.5 5.5z" stroke="currentColor" stroke-width="1.4"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button class="theme-btn" data-theme="sepia" aria-label="Sepia" title="Sepia" data-cuelume-press="sparkle">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="2" y="2.5" width="12" height="11" rx="1" stroke="currentColor" stroke-width="1.4" />
              <path d="M5 5.5H11M5 8H9M5 10.5H7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <div class="toolbar-row">
        <div class="filter-group">
          <select id="filter-category" class="filter-select" data-i18n-aria="filter-category">
            <option value="all">Todas las categorias</option>
          </select>
          <select id="filter-region" class="filter-select" data-i18n-aria="filter-region">
            <option value="all">Todas las regiones</option>
          </select>
          <div class="search-wrapper">
            <svg class="search-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <circle cx="6" cy="6" r="4" stroke="currentColor" stroke-width="1.4" />
              <path d="M9.5 9.5L12.5 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            <input type="search" id="filter-search" class="search-input" data-i18n-placeholder="search-placeholder"
              placeholder="Buscar sitios o feeds..." data-i18n-aria="search-placeholder">
          </div>
        </div>
      </div>

      <div class="toolbar-row toolbar-row-narrow">
        <label class="toggle">
          <input type="checkbox" class="toggle-input" id="toggle-main" data-cuelume-toggle>
          <svg class="toggle-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M7 2L8.2 5.4L11.8 5.5L8.9 7.6L9.9 11L7 9L4.1 11L5.1 7.6L2.2 5.5L5.8 5.4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
          </svg>
          <span class="toggle-track"></span>
          <span class="toggle-text" data-i18n="toggle-main">Solo feed principal</span>
        </label>
        <label class="toggle">
          <input type="checkbox" class="toggle-input" id="toggle-stale" data-cuelume-toggle>
          <svg class="toggle-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.3" />
            <path d="M7 4v3.5L9.5 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
          <span class="toggle-track"></span>
          <span class="toggle-text" data-i18n="toggle-stale">Mostrar inactivos</span>
        </label>
        <label class="toggle">
          <input type="checkbox" class="toggle-input" id="toggle-proxies" checked data-cuelume-toggle>
          <svg class="toggle-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M2 6.5L4.5 4v2h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M12 7.5L9.5 10V8h-6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
          <span class="toggle-track"></span>
          <span class="toggle-text" data-i18n="toggle-proxies">Mostrar proxies</span>
        </label>
        <label class="toggle">
          <input type="checkbox" class="toggle-input" id="toggle-group" checked data-cuelume-toggle>
          <svg class="toggle-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <rect x="2" y="2.5" width="10" height="3.5" rx=".8" stroke="currentColor" stroke-width="1.3" />
            <rect x="2" y="5.5" width="10" height="3.5" rx=".8" stroke="currentColor" stroke-width="1.3" />
            <rect x="2" y="8.5" width="10" height="3.5" rx=".8" stroke="currentColor" stroke-width="1.3" />
          </svg>
          <span class="toggle-track"></span>
          <span class="toggle-text" data-i18n="toggle-group">Agrupar por categoria</span>
        </label>
        <label class="toggle">
          <input type="checkbox" class="toggle-input" id="toggle-region" data-cuelume-toggle>
          <svg class="toggle-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M7 11.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Z" stroke="currentColor" stroke-width="1.3" />
            <circle cx="7" cy="7" r="2" fill="currentColor" />
          </svg>
          <span class="toggle-track"></span>
          <span class="toggle-text" data-i18n="toggle-region">Agrupar por region</span>
        </label>
        <label class="toggle">
          <input type="checkbox" class="toggle-input" id="toggle-site-together" data-cuelume-toggle>
          <svg class="toggle-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M2 7a3 3 0 0 1 6 0M6 7a3 3 0 0 0 6 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
          <span class="toggle-track"></span>
          <span class="toggle-text" data-i18n="toggle-site-together">Mantener sub-feeds unidos</span>
        </label>
      </div>

      <div class="toolbar-row action-row">
        <div class="counter-group">
          <span class="counter" id="counter">Cargando...</span>
          <div class="selection-group">
            <button class="selection-btn" id="select-all-btn" data-i18n="select-all-global" data-cuelume-press>Seleccionar todo</button>
            <button class="selection-btn" id="deselect-all-btn" data-i18n="deselect-all-global" data-cuelume-press>Deseleccionar
              todo</button>
            <button class="deselect-hidden-btn is-hidden" id="deselect-hidden" data-cuelume-press>Deseleccionar ocultos (0)</button>
          </div>

        </div>
        <div class="download-group">
          <div class="format-group" role="group" data-i18n-aria="format-label">
            <button class="format-option active" data-format="opml" data-cuelume-press>
              <svg class="format-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M2 3h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
                <path d="M2 7h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
                <path d="M2 11h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
              </svg>
              <span data-i18n="format-opml">OPML</span>
            </button>
            <button class="format-option" data-format="html" data-cuelume-press>
              <svg class="format-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.3" />
                <path d="M7 1.5c1.5 0 3 2.5 3 5.5s-1.5 5.5-3 5.5S4 9.5 4 7 5.5 1.5 7 1.5z" stroke="currentColor"
                  stroke-width="1.3" />
                <path d="M2.5 7h9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
              </svg>
              <span data-i18n="format-html">HTML</span>
            </button>
          </div>
          <button class="download-btn" id="download-btn" disabled data-cuelume-press data-cuelume-release>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M7 1v8M3 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" />
              <path d="M1.5 10v2a.5.5 0 0 0 .5.5h10a.5.5 0 0 0 .5-.5v-2" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" />
            </svg>
            <span data-i18n="download-opml">Descargar OPML</span>
          </button>
          <button class="download-btn-alt" id="download-btn-alt" disabled data-i18n-title="download-alt-title" data-cuelume-press data-cuelume-release>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M7 1v8M3 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" />
              <path d="M1.5 10v2a.5.5 0 0 0 .5.5h10a.5.5 0 0 0 .5-.5v-2" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" />
            </svg>
            <span data-i18n="download-alt">Version plana (sin categorias)</span>
          </button>
        </div>
      </div>
    </div>

    <main class="main-content">
      <div class="loading-state" id="loading" data-i18n="loading">Cargando datos...</div>
      <div class="error-state" id="error" hidden data-i18n="error">Error al cargar los datos. Intenta nuevamente mas
        tarde.</div>
      <div class="feed-list" id="feed-list"></div>
      <div class="empty-state" id="empty" hidden data-i18n="empty">No se encontraron feeds con los filtros actuales.
      </div>
    </main>

    <footer class="app-footer">
      <p>
        <span data-i18n="footer-data">Datos obtenidos de</span>
        <a href="https://github.com/alplox/awesome-chilean-rss" target="_blank" rel="noopener">awesome-chilean-rss</a>.
        <span data-i18n="footer-source">Codigo fuente en</span>
        <a href="https://github.com/alplox/awesome-chilean-rss-app" target="_blank" rel="noopener">GitHub</a>.
      </p>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
